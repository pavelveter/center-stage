; Center Stage configuration.
; Edit values here, or override on the command line with --camera N.

[camera]
; Camera device index. 0 is usually the built-in FaceTime camera on macOS.
index = 0

[capture]
; Input resolution requested from the camera.
in_width = 2560
in_height = 1440
; Output resolution published to the virtual camera.
out_width = 1920
out_height = 1080
fps = 30

[tracking]
; Crop factor: higher = tighter framing.
; 15% less crop than 1.5 (1.5 * 0.85 = 1.275) so hair stays in frame.
zoom = 1.275
; EMA smoothing factor (0.03..0.2). Lower = smoother/more inert.
smoothing = 0.04
; Normalized dead zone; ignore face motion smaller than this.
deadzone = 0.08
; Minimum face-detection confidence.
min_detection_confidence = 0.6
; Run face detection every N frames (1 = every frame, 3 = ~3x less CPU).
detect_every = 6
; Dolly-zoom spring response time in seconds; higher = slower/smoother zoom.
zoom_response_time = 0.5
; Dolly-zoom damping ratio; 1.0 = critically damped (no overshoot/bounce).
zoom_damping_ratio = 1.0

[color]
; Enable color grading LUT
lut_enabled = true
; The color grading lut table in the cube format
lut_file = LUT/tarantino-warm.cube
; Downscale factor for LUT application (1 = full quality, 4 = ~4x faster)
lut_scale = 6

[sharpen]
; Enable edge-aware sharpening (contours/texture without skin noise).
enabled = true
; Sharpening amount; 0.2-0.4 looks natural.
strength = 0.3
; Minimum local contrast (0-255) before a pixel is sharpened.
threshold = 10
; Gaussian radius for the high-pass filter.
sigma = 2.0
