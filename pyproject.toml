[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-stage"
version = "0.1.0"
description = "Center Stage-style framing and live effects for a webcam"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mediapipe>=1.2.3",
    "mido>=1.3.3",
    "moderngl>=5.13.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "python-rtmidi>=1.5.8",
    "pyvirtualcam>=0.15.0",
    "textual>=8.2.8",
]

[project.scripts]
hyper-stage = "hyper_stage.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["hyper_stage"]

[tool.setuptools.package-data]
hyper_stage = ["app.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "gpu: tests that need a working OpenGL context",
    "slow: timing-based integration tests",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
