; Hyper Stage configuration.
; Comments are written on every autosave; edit values freely.

; Webcam device and the selfie-mirror of the published stream.
[camera]
; AVFoundation camera index; run --list-cameras to see options.
index = 0
; Mirror the whole feed horizontally (selfie view).
flip = true

; Camera capture and the resolution/fps of the virtual camera.
[capture]
; Requested capture width; the camera may negotiate a different one.
in_width = 2560
; Requested capture height; detection always runs on a 640x360 copy.
in_height = 1440
; Virtual camera output width.
out_width = 1920
; Virtual camera output height; crop keeps this aspect ratio.
out_height = 1080
; Capture and virtual-camera frame rate.
fps = 30

; Center Stage: pan and zoom are independent controllers. Times are in seconds, deadbands are fractions of the frame.
[tracking]
; Master switch for face tracking (hotkey t / е).
enabled = true
; Base/max zoom factor; the controller never exceeds it. TUI: Zoom tuner.
zoom = 1.2
; MediaPipe detector confidence floor (0..1).
min_detection_confidence = 0.6
; Run inference every Nth frame (6 = ~5 detections/s at 30 fps).
detect_every = 6
; Head may occupy at most this fraction of the output height.
max_head_height = 0.667
; Full head / detected face bbox height; maps face size to framing.
head_ratio = 1.35
; Relative hysteresis on the zoom target (0.05 = 5%).
zoom_deadzone = 0.05
; Pan spring response time: larger = slower, calmer pan. TUI: Position Response.
position_response_time = 1.0943598368430187
; Pan damping (>=1 means no overshoot / oscillation).
position_damping = 1.0
; Ignore face-center moves below this fraction of the frame (0.01 = 1%).
position_deadband = 0.08
; Time constant for zoom-in: deliberately slow to avoid breathing.
zoom_in_response_time = 4.0
; Time constant for zoom-out: faster, keeps subject in frame.
zoom_out_response_time = 1.0
; Low-pass time constant for the filtered face-size measurement.
zoom_measurement_smoothing = 0.6
; After this long without a detection, ease back to default framing.
detection_timeout = 0.5
; Reject face-size changes faster than this fraction per second.
max_measurement_change = 0.6
; Publish raw/filtered center/size, zoom, age, velocity in telemetry.
debug = false

; LUT grading and GLSL shaders (applied to the camera, not the PiP image).
[color]
; Apply the .cube LUT (hotkey c / с).
lut_enabled = true
; Path to the .cube file (relative to this ini is fine).
lut_file = LUT/tarantino-warm.cube
; LUT downscale factor: higher = faster but softer grading.
lut_scale = 10
; Upscale only the color delta to keep fine detail.
lut_detail = true
; Apply the GLSL shader pack (hotkey h / р).
shader_enabled = false
; Path to a single .glsl or a shader pack directory.
shader_file = /Users/pavelveter/Projects/labs/hyper-stage/shaders/grain.glsl

; Edge-gated unsharp mask applied to the camera feed.
[sharpen]
; Edge-aware sharpening (hotkey s / ы).
enabled = true
; Unsharp-mask amount (0..1 looks natural).
strength = 0.5
; Minimum local contrast before sharpening kicks in.
threshold = 10
; Gaussian radius of the high-pass filter.
sigma = 2.0

; Time Loop / Deep Fry / Magic Loop (AFK) toggles.
[effects]
; Replay the last second of processed video (hotkey l / д).
time_loop = false
; High-contrast saturation + RGB channel roll (hotkey f / а).
deep_fry = false
; AFK: freeze framing and loop pre-recorded video (hotkey m / ь).
magic_loop = false

; Picture-in-Picture slide/meme background and its webcam window.
[pip]
; PiP slide/meme mode (hotkey p / з).
enabled = false
; Background image path; Pick button or dropdown in the TUI.
image = 
; Mirror the background image horizontally.
flip = true
; Webcam window size as a fraction of the output frame (0.25 = 25%).
scale = 0.25
; Equal pixel gap from every screen edge to the webcam window.
padding = 40
; Default corner: 0 TL, 1 TR, 2 BL, 3 BR; arrows move it live.
corner = 3
; Zoom transition duration in seconds when PiP toggles (0 = instant).
animation = 2.0

; TUI theme (change it with Ctrl+P -> theme).
[appearance]
; Textual theme name.
theme = tokyo-night

; Centered gradient caption published in the TUI text field.
[text]
; Draw the centered text overlay; Enter in the input turns it on.
enabled = false
; TTF name or absolute path; 'Nothing Font C' resolves from ~/Library/Fonts.
font_face = Kinetika
; Base font scale (1.0 = 32px); long lines shrink to fit.
font_scale = 4.0
; Text stroke width in pixels.
thickness = 3
; Minimum gap in pixels from the frame's left/right edges.
padding = 50
; Gradient start color at the left edge, #RRGGBB.
color_start = #B58DFF
; Gradient end color at the right edge, #RRGGBB.
color_end = #7FFFBB
; Published caption (persisted from the TUI input).
text = 
